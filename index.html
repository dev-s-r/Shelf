.tl.nt{background:var(--tile)!important}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:26px;background:var(--card)}.seg button{height:44px;border-radius:22px;font-weight:600;color:var(--fg)}.seg button[aria-pressed=true]{background:var(--lime);color:var(--ink)}.cd{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--card)}.bk{display:flex;gap:12px;align-items:center}.cv{flex:none;width:40px;height:56px;border-radius:4px 8px 8px 4px}.sg4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sg4 .ch{width:100%}.cps{display:flex;flex-wrap:wrap;gap:8px}.ch{min-height:44px;padding:0 16px;border-radius:22px;font-weight:600;font-size:15px;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}.ch.on{background:var(--lime);color:var(--ink);box-shadow:none}

.hero{touch-action:pan-y}.fb[aria-pressed=false]{filter:brightness(.82)}.fb[aria-pressed=true]{box-shadow:0 14px 24px rgba(20,22,31,.4)}.tl.nt{color:var(--fg)}.tl.nt .m{color:var(--mut)}.hx .bar{background:var(--line)}.hx .bar i{background:var(--fg)}
